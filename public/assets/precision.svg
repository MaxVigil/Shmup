<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="570" viewBox="0 0 512 570"
     role="img" aria-labelledby="title description">
  <title id="title">Реактивний літак у стилі концепту Mitsubishi F-3</title>
  <desc id="description">Узагальнений безхвостий двомоторний stealth-винищувач для Shmup гри, натхнений концептуальними зображеннями Mitsubishi F-3, вид зверху.</desc>

  <defs>
    <path id="f3-airframe-shape"
          d="M256 17
             L242 37
             C233 58 228 87 225 127
             L220 177
             L191 219
             L59 336
             C50 342 46 350 47 360
             L49 382
             C50 392 58 398 68 397
             L219 509
             L224 537
             C225 545 230 549 237 549
             L248 549
             L256 541
             L264 549
             L275 549
             C282 549 287 545 288 537
             L293 509
             L444 397
             C454 398 462 392 463 382
             L465 360
             C466 350 462 342 453 336
             L321 219
             L292 177
             L287 127
             C284 87 279 58 270 37Z"/>
    <clipPath id="f3-airframe-clip">
      <use href="#f3-airframe-shape"/>
    </clipPath>
  </defs>

  <g id="aircraft-f3-inspired">
    <use id="silhouette" href="#f3-airframe-shape" fill="#17232A"/>

    <g id="airframe" clip-path="url(#f3-airframe-clip)">
      <!-- Blended twin-engine stealth airframe. -->
      <path d="M256 29
               L249 42
               C241 62 237 90 234 130
               L229 182
               L198 226
               L66 342
               C59 346 56 352 57 359
               L59 378
               C60 384 64 387 71 386
               L225 498
               L233 535
               C234 538 236 540 240 540
               H246 L256 530 L266 540 H272
               C276 540 278 538 279 535
               L287 498
               L441 386
               C448 387 452 384 453 378
               L455 359
               C456 352 453 346 446 342
               L314 226
               L283 182
               L278 130
               C275 90 271 62 263 42Z"
            fill="#566B75"/>

      <!-- Diamond wing-body facets. -->
      <g id="upper-facets" fill="#83969D">
        <path d="M256 29 L240 130 L232 187 L203 225 L231 364 L248 506 L256 528Z"/>
        <path d="M256 29 L272 130 L280 187 L309 225 L281 364 L264 506 L256 528Z"/>

        <path d="M199 230
                 L67 345
                 C62 348 60 352 61 358
                 L63 376
                 C64 380 67 382 72 381
                 L218 497
                 L236 402
                 L233 334Z"/>
        <path d="M313 230
                 L445 345
                 C450 348 452 352 451 358
                 L449 376
                 C448 380 445 382 440 381
                 L294 497
                 L276 402
                 L279 334Z"/>
      </g>

      <!-- Stealth intake shadows. -->
      <g id="intakes" fill="#17232A">
        <path d="M198 236 L228 196 L228 341 L205 377 L184 341Z"/>
        <path d="M314 236 L284 196 L284 341 L307 377 L328 341Z"/>
      </g>

      <!-- Narrow centre spine between the engines. -->
      <path id="centre-spine"
            d="M256 28
               L247 57 L244 139 L238 194
               L237 341 L245 381
               L245 510 L256 527
               L267 510 L267 381
               L275 341 L274 194
               L268 139 L265 57Z"
            fill="#566B75"/>

      <!-- Large canted vertical fins mounted above the tailless wing-body. -->
      <g id="twin-tail-fins">
        <path d="M218 349 L246 382 L239 493 L204 451Z" fill="#17232A"/>
        <path d="M294 349 L266 382 L273 493 L308 451Z" fill="#17232A"/>
        <path d="M222 371 L239 390 L235 466 L216 444Z" fill="#566B75"/>
        <path d="M290 371 L273 390 L277 466 L296 444Z" fill="#566B75"/>
      </g>

      <!-- Twin flat exhaust nozzles. -->
      <g id="engine-nozzles" fill="#17232A">
        <path d="M224 496 H249 V540 Q249 545 244 545 H236 Q229 545 228 537Z"/>
        <path d="M263 496 H288 L284 537 Q283 545 276 545 H268 Q263 545 263 540Z"/>
      </g>
      <g fill="#83969D">
        <path d="M232 507 H244 V540 H236 Q232 540 232 535Z"/>
        <path d="M268 507 H280 L280 535 Q280 540 276 540 H268Z"/>
      </g>

      <!-- Compact low-observable canopy. -->
      <path id="canopy"
            d="M256 91
               C244 105 241 131 244 154
               L250 181
               C252 189 260 189 262 181
               L268 154
               C271 131 268 105 256 91Z"
            fill="#83969D" stroke="#17232A" stroke-width="4"/>

      <!-- Japanese-inspired roundels; decorative game markings. -->
      <g id="roundels" fill="#C44343" stroke="#566B75" stroke-width="5">
        <circle cx="121" cy="361" r="13"/>
        <circle cx="391" cy="361" r="13"/>
      </g>

      <g id="panel-lines" fill="none" stroke="#17232A" stroke-width="4" stroke-linecap="round" opacity="0.76">
        <path d="M220 177 L243 196"/>
        <path d="M292 177 L269 196"/>
        <path d="M219 509 L237 409"/>
        <path d="M293 509 L275 409"/>
      </g>
