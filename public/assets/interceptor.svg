                 L218 516
                 L238 478Z"/>
        <path d="M304 459
                 L344 502
                 C348 506 350 511 349 517
                 L347 527
                 C346 531 342 532 337 529
                 L294 516
                 L274 478Z"/>
      </g>

      <!-- Recessed side intakes. -->
      <g id="intakes" fill="#15232D">
