     role="img" aria-labelledby="title description">
  <title id="title">Узагальнений реактивний літак для Shmup гри</title>
  <desc id="description">Симетрична спрощена модель сучасного військового літака, вид зверху, носом угору, на прозорому тлі.</desc>

  <defs>
